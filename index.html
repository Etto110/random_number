<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estrazione Casuale</title>
<style>
    body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f4f4f9;
    }
    .container {
        background-color: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
        width: 100%;
        max-width: 320px;
    }
    h1 {
        margin-top: 0;
        color: #333;
        font-size: 1.5rem;
    }
    .inputs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }
    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
        text-align: center;
    }
    button {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    button:hover {
        background-color: #0056b3;
    }
    #result {
        margin-top: 20px;
        font-size: 3.5rem;
        font-weight: bold;
        color: #007bff;
        min-height: 67px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Estrazione Casuale</h1>
    <div class="inputs">
        <input type="number" id="min" value="1" aria-label="Valore minimo">
        <input type="number" id="max" value="100" aria-label="Valore massimo">
    </div>
    <button onclick="estrai()">Estrai</button>
    <div id="result">-</div>
</div>

<script>
    function estrai() {
        const min = parseInt(document.getElementById('min').value);
        const max = parseInt(document.getElementById('max').value);
        const resultDiv = document.getElementById('result');

        if (isNaN(min) || isNaN(max) || min > max) {
            resultDiv.textContent = "Err";
            resultDiv.style.color = "#dc3545";
            return;
        }

        const numero = Math.floor(Math.random() * (max - min + 1)) + min;
        
        resultDiv.style.color = "#007bff";
        resultDiv.textContent = numero;
    }
</script>

</body>
</html>
